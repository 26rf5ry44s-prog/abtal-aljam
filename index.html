<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أبطال الجمع | الصف الأول الابتدائي ب</title>
<style>
:root{--blue:#397fc5;--navy:#24527e;--ink:#24364b;--bg:#f3f8ff}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#eef7ff,#fff3f8);color:var(--ink);min-height:100vh;padding:18px}
main{max-width:620px;margin:0 auto}
.card{background:#fff;border:2px solid #e3effb;border-radius:26px;padding:22px;box-shadow:0 12px 32px #31577b18;margin:12px 0}
.hero{text-align:center;background:linear-gradient(135deg,#e6f3ff,#fff0f6)}
h1{color:var(--navy);font-size:clamp(27px,6vw,38px);margin:8px 0}
.sub{color:#5c7590;font-size:17px;line-height:1.9}
.mascot{font-size:54px;margin:4px}
label{display:block;font-weight:bold;margin:16px 0 8px}
input{width:100%;padding:15px;border:2px solid #cfe1f4;border-radius:14px;font:inherit;font-size:18px}
button{border:0;border-radius:15px;padding:14px 18px;font:inherit;font-size:18px;font-weight:bold;cursor:pointer}
.primary{background:var(--blue);color:white;width:100%;margin-top:16px}
.progressrow{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:bold}
.track{height:11px;background:#e8eef5;border-radius:20px;overflow:hidden;margin:12px 0 20px}
.bar{height:100%;background:linear-gradient(90deg,#5aa6e8,#f2a6c7);width:0%;transition:width .25s}
.question{background:#fff6df;border:2px dashed #f1d18b;border-radius:22px;text-align:center;padding:26px 12px;margin:16px 0}
.sum{font-size:clamp(38px,10vw,56px);font-weight:bold;color:#24527e;margin:12px 0}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.answer{background:#eaf4ff;color:#24527e;border:2px solid #d2e6fb;font-size:27px;padding:18px 5px}
.answer:disabled{cursor:default;opacity:1}
.answer.correct{background:#ddf6e8;border-color:#7bd3a2;color:#17643a}
.answer.wrong{background:#ffe6eb;border-color:#f1a1b2;color:#9b2941}
.feedback{text-align:center;border-radius:16px;background:#f5f8fc;padding:15px;margin-top:16px;font-size:18px;font-weight:bold}
.hidden{display:none!important}
.badge{background:#fff0c9;border-radius:30px;padding:8px 13px;color:#805b12}
.result{text-align:center;background:linear-gradient(135deg,#fff6df,#fff0f7)}
.score{font-size:48px;color:var(--navy);font-weight:bold;margin:12px}
.certificate{border:3px double #e1b95e;border-radius:18px;padding:20px;background:#fffdf6}
.secondary{background:#edf4fb;color:#24527e;width:100%;margin-top:10px}
.teacher-bubble{background:#ffeaa7;border:1px dashed #fab1a0;color:#d63031;padding:12px;border-radius:14px;margin-bottom:15px;font-size:16px;font-weight:bold;text-align:center;}
footer{text-align:center;color:#7890a8;font-size:13px;padding:12px}
</style>
</head>
<body>
<main>
<section class="card hero" id="welcome">
  <div class="mascot">🧮🌟</div>
  <h1>أبطال الجمع</h1>
  <div class="sub">لعبة حقائق الجمع من ٠ إلى ١٠</div>
  <p><strong>الصف: الأول الابتدائي / ب</strong><br><strong>إعداد: يارا خالد الاسمري</strong><br><strong>بإشراف المعلمة: حياة البيشي</strong></p>
  <label for="student">اكتبي اسم الطالبة للبدء:</label>
  <input id="student" placeholder="اكتبي اسم الطالبة هنا">
  <button class="primary" id="start">ابدئي اللعب 🚀</button>
</section>

<section class="card hidden" id="game">
  <div id="teacherBubble" class="teacher-bubble">أهلاً بك يا بطلة! سمّي بالله وابدئي.</div>
  <div class="progressrow"><span id="hello"></span><span class="badge">⭐ <span id="score">٠</span></span></div>
  <div class="progressrow" style="margin-top:12px"><span id="questionNo">السؤال ١ من ١٠</span><span>حقائق الجمع</span></div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div class="question">
    <div class="sum" id="sum">٢ + ٣ = ؟</div>
  </div>
  <div class="answers" id="answers"></div>
  <div class="feedback hidden" id="feedback"></div>
  <button class="primary hidden" id="next">السؤال التالي ←</button>
</section>

<section class="card result hidden" id="result">
  <div class="mascot">🏆🎉</div>
  <h1>أحسنتِ يا بطلة!</h1>
  <div class="certificate">
    <h2>شهادة إنجاز</h2>
    <h2 id="finalName"></h2>
    <div class="score" id="finalScore">٠ / ١٠</div>
    <p id="message"></p>
    <p><strong>بإشراف المعلمة: حياة البيشي</strong></p>
  </div>
  <button class="primary" id="again">العبِي مرة أخرى 🔄</button>
</section>
</main>
<script>
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const questions = [[0,0],[0,5],[3,0],[1,2],[2,3],[4,2],[5,3],[6,4],[7,2],[5,5]];
let index=0, score=0, studentName="";
const $=id=>document.getElementById(id);

// استخدام نظام صوتي داخلي مباشر ومضمون 100% يعمل في المتصفحات
function playSound(text) {
    $("teacherBubble").textContent = text;
    try {
        let speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'ar-SA';
        speech.rate = 0.95;
        window.speechSynthesis.speak(speech);
    } catch(e) {}
}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
$("start").addEventListener("click", start);
$("next").addEventListener("click", next);
$("again").addEventListener("click", () => {
    $("result").classList.add("hidden");
    $("welcome").classList.remove("hidden");
    $("student").value = "";
});

function start(){
 studentName=$("student").value.trim();
 if(!studentName){$("student").focus();return}
 index=0;score=0;
 $("welcome").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");
 $("hello").textContent="أهلًا "+studentName+" 🌷";
 playSound("يا هلا فيك يا " + studentName + "، شطورة!");
 render();
}

function render(){
 const [a,b]=questions[index], correct=a+b;
 $("score").textContent=ar(score);
 $("questionNo").textContent="السؤال "+ar(index+1)+" من ١٠";
 $("bar").style.width=((index+1)*10)+"%";
 $("sum").textContent=ar(a)+" + "+ar(b)+" = ؟";
 $("feedback").classList.add("hidden");
 $("next").classList.add("hidden");
 
 const options=shuffle([correct,...shuffle(Array.from({length:11},(_,i)=>i).filter(v=>v!==correct)).slice(0,2)]);
 $("answers").innerHTML="";
 options.forEach(value=>{
  let btn=document.createElement("button");
  btn.className="answer";
  btn.textContent=ar(value);
  btn.addEventListener("click",()=>choose(value,correct,btn));
  $("answers").appendChild(btn);
 });
}

function choose(value,correct,btn){
 const buttons=[$("_answers") || ...$("answers").children];
 [...$("answers").children].forEach(b=>b.disabled=true);
 const feedback=$("feedback");
 
 if(value===correct){
  score++;
  btn.classList.add("correct");
  feedback.textContent="أحسنتِ يا "+studentName+"! إجابة صحيحة ⭐🎉";
  playSound("كفو والله، جبتيها صح!");
 } else {
  btn.classList.add("wrong");
  let right=[...$("answers").children].find(b=>b.textContent===ar(correct));
  if(right) right.classList.add("correct");
  feedback.textContent="محاولة جميلة! الإجابة الصحيحة هي "+ar(correct)+" 💗";
  playSound("حاولي مرة ثانية، إنت قدها!");
 }
 
 $("score").textContent=ar(score);
 feedback.classList.remove("hidden");
 $("next").textContent=index===9?"عرض نتيجتي 🏆":"السؤال التالي ←";
 $("next").classList.remove("hidden");
}

function next(){
 if(index<9){
  index++;
  render();
 } else {
  $("game").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("finalName").textContent=studentName;
  $("finalScore").textContent=ar(score)+" / ١٠";
  $("message").textContent = score===10 ? "ممتازة! حصلتِ على الدرجة الكاملة 🌟" : "رائعة جداً، استمري في التميز 👏";
  playSound("أنهيت التحدي بكل شطارة، كفو!");
 }
}
</script>
</body>
</html>
