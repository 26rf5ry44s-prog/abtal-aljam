<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبطال الجمع - الصف الأول الابتدائي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3436;
        }
        .game-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #0984e3;
            margin-bottom: 5px;
        }
        .info {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 20px;
        }
        .question-box {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0;
            color: #2d3436;
            background: #dfe6e9;
            padding: 15px;
            border-radius: 12px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        button.option-btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        button.option-btn:hover {
            background-color: #00cec9;
            transform: scale(1.03);
        }
        .score {
            font-size: 18px;
            font-weight: bold;
            color: #e17055;
            margin-top: 15px;
        }
        .teacher-bubble {
            background: #ffeaa7;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 15px;
            color: #d63031;
            margin-bottom: 15px;
            font-weight: bold;
            border: 1px dashed #fab1a0;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🧮 أبطال الجمع</h1>
        <div class="info">الصف الأول الابتدائي / ب<br>بإشراف المعلمة: حياة البيشي</div>

        <!-- صندوق رسائل المعلمة العامية -->
        <div id="teacherMessage" class="teacher-bubble">يا هلا فيك يالبطل! سمّي بالله ونبقى نلعب سوا.</div>

        <div id="gameArea">
            <div id="questionText" class="question-box">٢ + ٣ = ؟</div>
            <div class="options" id="optionsContainer">
                <!-- الأزرار تتولد تلقائياً عبر الجافاسكريبت -->
            </div>
        </div>

        <div class="score" id="scoreText">النتيجة: ٠ / ٥</div>
    </div>

    <script>
        // أسئلة اللعبة
        const questions = [
            { q: "٠ + ٥ = ؟", answer: 5, options: [3, 5, 7, 2] },
            { q: "٢ + ٣ = ؟", answer: 5, options: [4, 5, 6, 1] },
            { q: "١ + ٤ = ؟", answer: 5, options: [5, 3, 8, 2] },
            { q: "٣ + ٣ = ؟", answer: 6, options: [5, 6, 7, 4] },
            { q: "٤ + ٤ = ؟", answer: 8, options: [7, 8, 9, 6] }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // دالة نطق المعلمة بلهجة نجدية عامية دافئة
        function speakTeacher(text) {
            // تحديث النص في الصندوق المرئي أيضاً
            document.getElementById("teacherMessage").innerText = text;

            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; // اللهجة السعودية
            utterance.rate = 1.0;     // سرعة طبيعية
            utterance.pitch = 1.25;   // نبرة حماسية وودودة

            // محاولة اختيار صوت عربي أنثوي إن وجد في المتصفح
            let voices = window.speechSynthesis.getVoices();
            let arabicVoice = voices.find(v => v.lang.includes('ar'));
            if (arabicVoice) {
                utterance.voice = arabicVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // تحميل الأسئلة في الصفحة
        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showWinScreen();
                return;
            }

            let currentQ = questions[currentQuestionIndex];
            document.getElementById("questionText").innerText = currentQ.q;
            document.getElementById("scoreText").innerText = `النتيجة: ${score} / ${questions.length}`;

            let optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            // ترتيب الخيارات عشوائياً
            let shuffledOptions = [...currentQ.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, currentQ.answer);
                optionsContainer.appendChild(btn);
            });
        }

        // التحقق من الإجابة
        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score++;
                let praises = [
                    "كفو والله يالبطل! إجابة تفلّق الحجر!",
                    "ما شاء الله عليك، ذكي وعينك باردة!",
                    "ياسلام عليك! نجم اللعبة اليوم بلا منازع."
                ];
                let randomPraise = praises[Math.floor(Math.random() * praises.length)];
                speakTeacher(randomPraise);
            } else {
                let mistakes = [
                    "معليش يالغالي، خطأ بسيط ونتعلم منه، جرب مرة ثانية.",
                    "قريبة جداً منك! ركّز شوي وبتجيبها صح.",
                    "ما فيه مشكلة، الأبطال ما ييأسون، حاول كمان مرة."
                ];
                let randomMistake = mistakes[Math.floor(Math.random() * mistakes.length)];
                speakTeacher(randomMistake);
            }

            currentQuestionIndex++;
            setTimeout(loadQuestion, 2250); // الانتظار قليلاً قبل الانتقال للسؤال التالي
        }

        // شاشة النهاية والفوز
        function showWinScreen() {
            document.getElementById("gameArea").innerHTML = `
                <h2>🏆 كفو والله! أتممت التحدي بنجاح</h2>
                <p>رفعت راسنا يا بطل أبطال الجمع!</p>
                <p><strong>بإشراف المعلمة: حياة البيشي</strong></p>
            `;
            speakTeacher("ياحي هالراس! كسبت التحدي وطلعت بطل الأبطال، تستاهل أكبر تحية!");
        }

        // تشغيل الترحيب أول ما تفتح اللعبة
        window.onload = () => {
            setTimeout(() => {
                speakTeacher("يا هلا فيك يالبطل! سمّي بالله وخلينا نوري العالم شطارتك بالجمع.");
                loadQuestion();
            }, 500);
        };

        // لضمان تحميل أصوات المتصفح في الخلفية
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
