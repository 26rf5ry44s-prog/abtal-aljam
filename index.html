<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أميرات الجمع</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe6f2 0%, #fff4e6 50%, #e8f5ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #2d2235;
    }

    .game-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 14px 35px rgba(130, 60, 130, 0.14);
      border: 3px solid #ffd1e8;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #fff0f7;
      color: #c21872;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 4px 0 8px;
      font-size: 1.85rem;
      color: #7b1fa2;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 1rem;
      color: #5a4b66;
      line-height: 1.5;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #faf5ff;
      padding: 10px 14px;
      border-radius: 16px;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .question-box {
      background: linear-gradient(145deg, #fff9fc, #f4f9ff);
      border: 2px dashed #e2b8f5;
      border-radius: 22px;
      padding: 22px 14px;
      margin-bottom: 18px;
    }

    .question-label {
      font-size: 0.95rem;
      color: #7a688a;
      margin-bottom: 8px;
    }

    .equation {
      font-size: 2.5rem;
      font-weight: 800;
      color: #4a148c;
      direction: ltr;
      display: inline-block;
      letter-spacing: 2px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px 12px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .option-btn {
      background: #f3e5f5;
      color: #4a148c;
      box-shadow: 0 4px 0 #d1a3dc;
    }

    .option-btn:hover {
      background: #ebd3f0;
    }

    .option-btn.correct {
      background: #d8f8e1;
      color: #136f36;
      box-shadow: 0 4px 0 #7fd196;
    }

    .option-btn.wrong {
      background: #ffe0e6;
      color: #a61b38;
      box-shadow: 0 4px 0 #f294a8;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #e91e8c, #9c27b0);
      color: #fff;
      font-size: 1.15rem;
      padding: 15px 18px;
      box-shadow: 0 5px 0 #6a1b7a;
    }

    .secondary-btn {
      background: #fff3e0;
      color: #b25000;
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 3px 0 #f0c282;
    }

    .feedback {
      min-height: 32px;
      font-weight: 700;
      font-size: 1.05rem;
      margin: 10px 0 14px;
      line-height: 1.5;
    }

    .feedback.good {
      color: #15733a;
    }

    .feedback.try-again {
      color: #b81d3b;
    }

    .certificate-box {
      background: linear-gradient(145deg, #fffdf0, #fff3fa);
      border: 3px solid #f6c453;
      border-radius: 24px;
      padding: 24px 18px;
      margin-bottom: 16px;
    }

    .trophy {
      font-size: 3.2rem;
      margin-bottom: 8px;
    }

    .cert-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #9c4a00;
      margin: 0 0 8px;
    }

    .cert-text {
      color: #4d3c5c;
      line-height: 1.6;
      margin: 0 0 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="game-card">
    <div class="badge">✨ عالم الحساب والمرح ✨</div>
    <h1>أميرات الجمع</h1>

    <!-- شاشة البداية -->
    <section id="startScreen">
      <p class="subtitle">
        مرحباً صديقاتي! هيا نجمع الأعداد بذكاء وحماس ونحصل على شهادة التميز في النهاية.
      </p>
      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap;">
        <button type="button" class="secondary-btn" onclick="playIntro1()">👋 ترحيب يارا</button>
        <button type="button" class="secondary-btn" onclick="playIntro2()">📣 حماس البداية</button>
      </div>
      <button type="button" class="primary-btn" onclick="startGame()">ابد
