<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أميرات الجمع</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe6f2 0%, #fff4e6 50%, #e8f5ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #2d2235;
    }

    .game-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 14px 35px rgba(130, 60, 130, 0.14);
      border: 3px solid #ffd1e8;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #fff0f7;
      color: #c21872;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 4px 0 8px;
      font-size: 1.85rem;
      color: #7b1fa2;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 1rem;
      color: #5a4b66;
      line-height: 1.5;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #faf5ff;
      padding: 10px 14px;
      border-radius: 16px;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .question-box {
      background: linear-gradient(145deg, #fff9fc, #f4f9ff);
      border: 2px dashed #e2b8f5;
      border-radius: 22px;
      padding: 22px 14px;
      margin-bottom: 18px;
    }

    .question-label {
      font-size: 0.95rem;
      color: #7a688a;
      margin-bottom: 8px;
    }

    .equation {
      font-size: 2.5rem;
      font-weight: 800;
      color: #4a148c;
      direction: ltr;
      display: inline-block;
      letter-spacing: 2px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px 12px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .option-btn {
      background: #f3e5f5;
      color: #4a148c;
      box-shadow: 0 4px 0 #d1a3dc;
    }

    .option-btn:hover {
      background: #ebd3f0;
    }

    .option-btn.correct {
      background: #d8f8e1;
      color: #136f36;
      box-shadow: 0 4px 0 #7fd196;
    }

    .option-btn.wrong {
      background: #ffe0e6;
      color: #a61b38;
      box-shadow: 0 4px 0 #f294a8;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #e91e8c, #9c27b0);
      color: #fff;
      font-size: 1.15rem;
      padding: 15px 18px;
      box-shadow: 0 5px 0 #6a1b7a;
    }

    .secondary-btn {
      background: #fff3e0;
      color: #b25000;
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 3px 0 #f0c282;
    }

    .feedback {
      min-height: 32px;
      font-weight: 700;
      font-size: 1.05rem;
      margin: 10px 0 14px;
      line-height: 1.5;
    }

    .feedback.good {
      color: #15733a;
    }

    .feedback.try-again {
      color: #b81d3b;
    }

    .certificate-box {
      background: linear-gradient(145deg, #fffdf0, #fff3fa);
      border: 3px solid #f6c453;
      border-radius: 24px;
      padding: 24px 18px;
      margin-bottom: 16px;
    }

    .trophy {
      font-size: 3.2rem;
      margin-bottom: 8px;
    }

    .cert-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #9c4a00;
      margin: 0 0 8px;
    }

    .cert-text {
      color: #4d3c5c;
      line-height: 1.6;
      margin: 0 0 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="game-card">
    <div class="badge">✨ عالم الحساب والمرح ✨</div>
    <h1>أميرات الجمع</h1>

    <!-- شاشة البداية -->
    <section id="startScreen">
      <p class="subtitle">
        مرحباً صديقاتي! هيا نجمع الأعداد بذكاء وحماس ونحصل على شهادة التميز في النهاية.
      </p>
      <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap;">
        <button type="button" class="secondary-btn" onclick="playIntro1()">👋 ترحيب يارا</button>
        <button type="button" class="secondary-btn" onclick="playIntro2()">📣 حماس البداية</button>
      </div>
      <button type="button" class="primary-btn" onclick="startGame()">ابدئي اللعب الآن 🚀</button>
    </section>

    <!-- شاشة اللعب -->
    <section id="gameScreen" class="hidden">
      <div class="top-bar">
        <span id="progressText">السؤال 1 من 6</span>
        <span id="scoreText">النجوم: ⭐ 0</span>
        <button type="button" class="secondary-btn" style="padding: 6px 10px; font-size: 0.85rem;" onclick="replayCurrentPrompt()">🔊 إعادة الصوت</button>
      </div>

      <div class="question-box">
        <div class="question-label">كم يساوي ناتج الجمع؟</div>
        <div id="equationText" class="equation">2 + 3 = ?</div>
      </div>

      <div id="optionsGrid" class="options-grid"></div>
      <div id="feedbackText" class="feedback"></div>
    </section>

    <!-- شاشة الشهادة الختامية -->
    <section id="endScreen" class="hidden">
      <div class="certificate-box">
        <div class="trophy">👑🏆👑</div>
        <h2 class="cert-title">شهادة أميرة الجمع</h2>
        <p id="certSummary" class="cert-text"></p>
        <button type="button" class="secondary-btn" onclick="playCertificateAudio()">🎵 استمعي لكلمة الشهادة</button>
      </div>
      <button type="button" class="primary-btn" onclick="startGame()">العبـي مرة أخرى 🔄</button>
    </section>
  </main>

  <script>
    // أسماء الملفات الصوتية في مجلد المشروع
    const SOUNDS = {
      intro1: "f1.wav.wav",
      intro2: "AUDIO-2026-11-19-18-17-21.m4a",
      correct: [
        "c1.wav.wav",
        "c2.wav.wav",
        "c3.wav.wav",
        "c4.wav.wav"
      ],
      wrong: "w1.wav.wav",
      certificate: "AUDIO-2026-11-19-18-17-33.m4a"
    };

    // أسئلة الجمع (يمكنك تعديلها أو زيادتها بسهولة)
    const QUESTIONS = [
      { a: 2, b: 3, choices: [4, 5, 6, 7] },
      { a: 4, b: 5, choices: [8, 9, 10, 7] },
      { a: 6, b: 2, choices: [7, 8, 9, 10] },
      { a: 5, b: 5, choices: [9, 11, 10, 12] },
      { a: 7, b: 3, choices: [9, 10, 8, 11] },
      { a: 8, b: 4, choices: [11, 13, 12, 10] }
    ];

    let currentIndex = 0;
    let score = 0;
    let correctSoundIndex = 0;
    let lastAudioType = "intro2";
    let isLocked = false;

    const audioPlayer = new Audio();

    function playAudioFile(src) {
      if (!src) return;
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.src = src;
      audioPlayer.play().catch(() => {
        // تجاهل خطأ المتصفح إذا منع التشغيل التلقائي قبل التفاعل
      });
    }

    function playIntro1() {
      lastAudioType = "intro1";
      playAudioFile(SOUNDS.intro1);
    }

    function playIntro2() {
      lastAudioType = "intro2";
      playAudioFile(SOUNDS.intro2);
    }

    function playCertificateAudio() {
      lastAudioType = "certificate";
      playAudioFile(SOUNDS.certificate);
    }

    function getNextCorrectSound() {
      const file = SOUNDS.correct[correctSoundIndex % SOUNDS.correct.length];
      correctSoundIndex++;
      return file;
    }

    function replayCurrentPrompt() {
      if (lastAudioType === "correct") {
        const prevIndex = (correctSoundIndex - 1 + SOUNDS.correct.length) % SOUNDS.correct.length;
        playAudioFile(SOUNDS.correct[prevIndex]);
      } else if (lastAudioType === "wrong") {
        playAudioFile(SOUNDS.wrong);
      } else if (lastAudioType === "certificate") {
        playCertificateAudio();
      } else {
        playIntro2();
      }
    }

    function startGame() {
      currentIndex = 0;
      score = 0;
      correctSoundIndex = 0;
      isLocked = false;

      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");

      playIntro2();
      renderQuestion();
    }

    function renderQuestion() {
      isLocked = false;
      const q = QUESTIONS[currentIndex];
      const answer = q.a + q.b;

      document.getElementById("progressText").textContent = `السؤال ${currentIndex + 1} من ${QUESTIONS.length}`;
      document.getElementById("scoreText").textContent = `النجوم: ⭐ ${score}`;
      document.getElementById("equationText").textContent = `${q.a} + ${q.b} = ?`;

      const feedbackEl = document.getElementById("feedbackText");
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";

      q.choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = choice;
        btn.onclick = () => handleAnswer(choice === answer, btn);
        grid.appendChild(btn);
      });
    }

    function handleAnswer(isCorrect, clickedBtn) {
      if (isLocked) return;

      const feedbackEl = document.getElementById("feedbackText");

      if (isCorrect) {
        isLocked = true;
        score++;
        document.getElementById("scoreText").textContent = `النجوم: ⭐ ${score}`;
        clickedBtn.classList.add("correct");

        feedbackEl.textContent = "أحسنتِ! إجابة صحيحة 🎉";
        feedbackEl.className = "feedback good";

        lastAudioType = "correct";
        playAudioFile(getNextCorrectSound());

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < QUESTIONS.length) {
            renderQuestion();
          } else {
            showCertificate();
          }
        }, 1700);
      } else {
        clickedBtn.classList.add("wrong");
        feedbackEl.textContent = "حاولي مرة ثانية، إنتِ قدها! 💪";
        feedbackEl.className = "feedback try-again";

        lastAudioType = "wrong";
        playAudioFile(SOUNDS.wrong);
      }
    }

    function showCertificate() {
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.remove("hidden");

      document.getElementById("certSummary").textContent =
        `أبدعتِ يا بطلة! أنهيتِ جميع الأسئلة وحصلتِ على ${score} من ${QUESTIONS.length} نجوم في لعبة أميرات الجمع.`;

      lastAudioType = "certificate";
      playCertificateAudio();
    }
  </script>
</body>
</html>
